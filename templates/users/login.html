{% extends 'base.html' %}

{% block content %}

<style>

.login-container{
    width:400px;
    margin:60px auto;
}

.login-card{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
    text-align:center;
}

.login-title{
    font-size:50px;
    margin-bottom:30px;
}

.form-input{
    width:100%;
    padding:14px;
    margin-bottom:20px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
}

.login-btn{
    width:100%;
    background:#ff1493;
    color:white;
    border:none;
    padding:14px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    background:#e60073;
}

.back-btn{
    display:inline-block;
    margin-bottom:20px;
    background:#ff1493;
    color:white;
    padding:10px 20px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

.error{
    color:red;
    margin-bottom:15px;
}

</style>

<div class="login-container">

    <a href="/" class="back-btn">
        ← Back
    </a>

    <div class="login-card">

        <h1 class="login-title">
            🔐 Login
        </h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                class="form-input"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                class="form-input"
                required
            >

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
