{% extends 'base.html' %}

{% block title %}Checkout{% endblock %}

{% block content %}

<style>

.checkout-container{
    max-width:700px;
    margin:40px auto;
}

.checkout-card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.btn-pink{
    background:#ff4da6;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:30px;
    font-size:18px;
}

input, textarea{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border-radius:10px;
    border:1px solid #ccc;
}

</style>

<div class="checkout-container">

    <div class="checkout-card">

        <h2>🧾 Checkout</h2>

        <hr>

        {% for item in cart_items %}

            <h4>{{ item.product.name }}</h4>

            <p>
                ₹{{ item.product.price }} × {{ item.quantity }}
            </p>

        {% endfor %}

        <h3>Total: ₹{{ total }}</h3>

        <hr>

        <form method="POST">
    {% csrf_token %}

    <input type="text" name="name" placeholder="Full Name" required><br><br>

    <textarea name="address" placeholder="Address" required></textarea><br><br>

    <input type="text" name="phone" placeholder="Phone" required><br><br>

    <h3>Total: ₹{{ total }}</h3>

    <button type="submit" style="background:pink;padding:10px;">
        Proceed to Payment
    </button>
</form>

<br>

<a href="{% url 'cart_detail' %}">
    <button style="background:#ff4da6;color:white;">
        ⬅ Back to Cart
    </button>
</a>

    </div>

</div>

{% endblock %}
