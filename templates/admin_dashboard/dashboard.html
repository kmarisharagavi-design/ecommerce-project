{% extends 'base.html' %}

{% block content %}

<style>

body{
    background:#f5f5f5;
}

.dashboard-container{
    width:90%;
    margin:40px auto;
}

.dashboard-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.dashboard-title{
    font-size:45px;
    font-weight:bold;
    color:#222;
}

.dashboard-btn{
    background:#ff1493;
    color:white;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    text-decoration:none;
    transition:0.3s;
}

.dashboard-btn:hover{
    background:#e60073;
}

.stats-container{
    display:flex;
    gap:30px;
    flex-wrap:wrap;
    margin-bottom:50px;
}

.stat-card{
    flex:1;
    min-width:250px;
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.stat-card h2{
    font-size:45px;
    color:#ff1493;
    margin-bottom:10px;
}

.stat-card p{
    font-size:22px;
    font-weight:bold;
    color:#333;
}

.chart-box{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.chart-title{
    font-size:30px;
    font-weight:bold;
    margin-bottom:40px;
    color:#222;
}

.bar-container{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:60px;
    height:350px;
}

.bar-wrapper{
    text-align:center;
}

.bar{
    width:120px;
    background:#ff1493;
    border-radius:20px 20px 0 0;
    position:relative;
    transition:0.3s;
}

.bar:hover{
    transform:scale(1.05);
    background:#e60073;
}

.products-bar{
    height:220px;
}

.orders-bar{
    height:170px;
}

.users-bar{
    height:130px;
}

.bar-value{
    position:absolute;
    top:-35px;
    width:100%;
    font-size:22px;
    font-weight:bold;
    color:#222;
}

.bar-label{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
    color:#333;
}

</style>

<div class="dashboard-container">

    <div class="dashboard-top">

        <a href="/dashboard/" class="dashboard-btn">
    📊 Dashboard
</a>

        <a href="/" class="dashboard-btn">
            ← Back Home
        </a>

    </div>

    <div class="stats-container">

        <div class="stat-card">
            <h2>{{ total_products }}</h2>
            <p>Products</p>
        </div>

        <div class="stat-card">
            <h2>{{ total_orders }}</h2>
            <p>Orders</p>
        </div>

        <div class="stat-card">
            <h2>{{ total_users }}</h2>
            <p>Users</p>
        </div>

    </div>

    <div class="chart-box">

        <h2 class="chart-title">
            📈 Overview Chart
        </h2>

        <div class="bar-container">

            <div class="bar-wrapper">

                <div class="bar products-bar">
                    <div class="bar-value">
                        {{ total_products }}
                    </div>
                </div>

                <div class="bar-label">
                    Products
                </div>

            </div>

            <div class="bar-wrapper">

                <div class="bar orders-bar">
                    <div class="bar-value">
                        {{ total_orders }}
                    </div>
                </div>

                <div class="bar-label">
                    Orders
                </div>

            </div>

            <div class="bar-wrapper">

                <div class="bar users-bar">
                    <div class="bar-value">
                        {{ total_users }}
                    </div>
                </div>

                <div class="bar-label">
                    Users
                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
